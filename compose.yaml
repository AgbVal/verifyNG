services:
  postgres:
    image: postgres:17
    container_name: verifyng-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - verifyng_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifyng -d verifyng"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    image: verifyng-api:dev
    container_name: verifyng-api
    ports:
      - "3001:3001"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      PORT: 3001
    depends_on:
      postgres:
        condition: service_healthy

  web:
    image: verifyng-web:dev
    container_name: verifyng-web
    ports:
      - "3000:3000"

  worker:
    image: verifyng-worker:dev
    container_name: verifyng-worker

volumes:
  verifyng_postgres_data:

