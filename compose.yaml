services:
  postgres:
    image: postgres:17
    container_name: verifyng-postgres
    environment:
      POSTGRES_USER: verifyng
      POSTGRES_PASSWORD: verifyng_dev_password
      POSTGRES_DB: verifyng
    ports:
      - "5432:5432"
    volumes:
      - verifyng_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verifyng -d verifyng"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  verifyng_postgres_data:
